<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="left-side">
            <div class="dashboard">
                <img src="svg/view-dashboard.svg">
                <h2>Dashboard</h2>
            </div>
            <div class="home">
                <img src="svg/home.svg">
                <h3>Home</h3>
            </div>
            <div class="profile">
                <img src="svg/face-man.svg">
                <h3>Profile</h3>
            </div>
            <div class="msgs">
                <img src="svg/comment.svg">
                <h3>Messages</h3>
            </div>
            <div class="histroy">
                <img src="svg/clock.svg">
                <h3>History</h3>
            </div>
            <div class="tasks">
                <img src="svg/clipboard-check.svg">
                <h3>Tasks</h3>
            </div>
            <div class="community">
                <img src="svg/account-group-outline.svg">
                <h3>Communities</h3>
            </div>
            <div class="settings">
                <img src="svg/settings.svg">
                <h3>Settings</h3>
            </div>
            <div class="support">
                <img src="svg/clipboard-alert-outline.svg">
                <h3>Support</h3>
            </div>
            <div class="privacy">
                <img src="svg/shield-check-outline.svg">
                <h3>Privacy</h3>
            </div>
        </div>
    </div>

</body>

</html>
